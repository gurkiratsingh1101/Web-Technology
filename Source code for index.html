<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Travel Planner - Discover destinations, plan trips and estimate travel budgets.">
    <title>Smart Travel Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center gap-2" href="#home">
            <span class="brand-icon">
                <i class="bi bi-compass"></i>
            </span>
            <span>Smart<span>Travel</span></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                <li class="nav-item">
                    <a class="nav-link active" href="#home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#destinations">Destinations</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#planner">Trip Planner</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#budget">Budget</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-primary-custom ms-lg-2" href="#planner">
                        Plan a Trip
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<main>

<section id="home" class="hero-section">

    <div class="container hero-content">

        <div class="row align-items-center min-vh-100 py-5">

            <div class="col-lg-8">

                <span class="eyebrow">
                    <i class="bi bi-stars"></i>
                    Your journey starts here
                </span>

                <h1>
                    Plan less.<br>
                    <span>Travel more.</span>
                </h1>

                <p class="hero-text">
                    Discover destinations, build your itinerary and estimate
                    your trip budget from one simple travel planner.
                </p>

                <div class="search-box">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="heroSearch"
                            class="form-control"
                            placeholder="Search a destination..."
                        >

                        <button
                            class="btn btn-primary-custom"
                            id="heroSearchBtn"
                        >
                            Explore
                        </button>

                    </div>

                </div>

                <div class="hero-stats">

                    <div>
                        <strong>50+</strong>
                        <span>Destinations</span>
                    </div>

                    <div>
                        <strong>24/7</strong>
                        <span>Planning</span>
                    </div>

                    <div>
                        <strong>100%</strong>
                        <span>Simple</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
